apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gedtotal-signature-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eurival/gedtotal-signature-service.git
    targetRevision: main
    path: infra/kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: gedtotalap-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
