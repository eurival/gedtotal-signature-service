spring:
  application:
    name: gedtotal-signature-service
  kafka:
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "br.com.arquivototal.gedtotalsignature.domain.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    oauth2-enabled: false
  internal-api:
    gedtotalapi-base-url: http://localhost:8080
  signature:
    advanced-system:
      signer-name: GedTotal Advanced Signature
      reason: Assinatura avancada do sistema
      location: GedTotal
    qualified-icp-brasil:
      enabled: false
      key-store-path:
      key-store-password:
      key-alias:
      key-password:
      signer-name: GedTotal ICP-Brasil
      reason: Assinatura qualificada ICP-Brasil
      location: GedTotal
    timestamp:
      enabled: false
      tsa-url:
      authority-name: GedTotal Time
  kafka:
    topics:
      signature-request: custodia.signature.request
      signature-result: custodia.signature.result
      signature-failure: custodia.signature.failure
