name: Build and Push 'gedtotal-signature-service' Docker Image

on:
  push:
    branches: ['main']
    paths-ignore:
      - 'infra/kubernetes/**'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/eurival/gedtotal-signature-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extrair versão do pom.xml
        run: echo "IMAGE_VERSION=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)" >> $GITHUB_ENV

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, empacotar e Push com Jib
        run: |
          mvn -B -DskipTests clean package jib:build \
            -Djib.to.image=${{ env.IMAGE_NAME }} \
            -Djib.to.tags=latest,${{ env.IMAGE_VERSION }} \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      - name: Instalar yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Atualizar tag no kustomization.yaml
        run: |
          FILE="infra/kubernetes/kustomization.yaml"
          yq -i '
            (.images[] | select(.name == env(IMAGE_NAME))).newTag = env(IMAGE_VERSION)
          ' "$FILE"

      - name: Commit & push da nova tag
        run: |
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add infra/kubernetes/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Nada para commitar (tag já está atual)"; exit 0
          fi
          git commit -m "chore(deploy): gedtotal-signature-service ${IMAGE_VERSION}"
          git push

